<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>autosetup</title>
<link rel="stylesheet" href="/style.css">
</head><body>
<div class="app">
 <nav class="hdr">
  <button type="button" class="tab" data-screen="analysis" id="tab-analysis" data-t="tab.analysis"></button>
  <button type="button" class="tab" data-screen="setup" id="tab-setup" data-t="tab.setup"></button>
  <button type="button" class="tab" data-screen="history" id="tab-history" data-t="tab.history"></button>
  <span class="ctx" id="ctx"></span>
  <div class="right">
   <span class="err" id="err"></span>
   <span class="live" id="live"><span class="dot"></span><span id="live-text"></span></span>
   <button type="button" class="tbtn" id="hist-back" hidden data-t="nav.back"></button>
   <div class="menu-wrap">
    <button type="button" class="ibtn" id="menu-btn" aria-haspopup="menu" aria-expanded="false" data-tt="nav.menu"><svg class="ico" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <div class="menu" id="menu" role="menu">
     <button type="button" class="mitem" role="menuitem" data-go="home" data-t="menu.home"></button>
     <button type="button" class="mitem" role="menuitem" data-go="driver" data-t="menu.driver"></button>
     <button type="button" class="mitem" role="menuitem" data-go="settings" data-t="menu.settings"></button>
     <button type="button" class="mitem" role="menuitem" data-go="about" data-t="menu.about"></button>
    </div>
   </div>
  </div>
 </nav>
 <main>
  <section class="screen" id="screen-home"><div class="home" id="home"></div></section>

  <section class="screen" id="screen-analysis">
   <div class="split">
    <aside class="left">
     <div class="card sess"><div class="trk" id="a-track"></div><div class="model" id="a-model"></div><div class="car" id="a-car"></div></div>
     <div class="stints"><div class="lbl" data-t="stints.title"></div><div class="group" id="stints"></div></div>
    </aside>
    <div class="centre">
     <div class="bar">
      <span class="agap" id="agap"></span>
      <span class="grow"></span>
      <div class="seg" id="linemode" role="group" data-tt="line.label"></div>
     </div>
     <div class="stage">
      <div class="mapv" id="mapt"><canvas id="map" role="img" data-tt="map.label"></canvas><div class="cgap" id="cgap"></div>
       <div class="wait" id="wait" hidden></div>
       <div class="mapctl" role="group">
        <button type="button" id="zin" data-tt="map.zoomin"><svg class="ico" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
        <button type="button" id="zout" data-tt="map.zoomout"><svg class="ico" viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
        <button type="button" id="fit" data-tt="map.fit"><svg class="ico" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
        <button type="button" id="follow" aria-pressed="false" data-tt="map.follow"><svg class="ico" viewBox="0 0 24 24"><path d="M12 3l6 16-6-4-6 4z"/></svg></button>
       </div>
      </div>
      <div class="deck" id="deck"><canvas id="deckc" role="img" data-tt="deck.label"></canvas><div class="dread" id="dread"></div></div>
     </div>
     <div class="dock" id="dock">
      <div class="mirror"><div class="side a" id="sideA"></div><div class="ctrl"><button type="button" class="play" id="pp"></button></div><div class="side b" id="sideB"></div></div>
      <div class="tl" id="scrub" role="slider" tabindex="0" aria-valuemin="0" aria-valuemax="100" data-tt="play.position"><span class="tlt" id="tnow"></span><div class="rail" id="rail"><i class="fill" id="tfill"></i><span class="head" id="phead"></span></div><span class="tlt end" id="tend"></span></div>
     </div>
    </div>
   </div>
  </section>

  <section class="screen" id="screen-setup">
   <div class="setup">
    <div class="tiles" id="tiles"></div>
    <aside class="panel" id="panel"></aside>
   </div>
  </section>

  <section class="screen" id="screen-history"><div class="page" id="history"></div></section>
  <section class="screen" id="screen-driver"><div class="page" id="driver"></div></section>
  <section class="screen" id="screen-settings"><div class="page" id="settings"></div></section>
 </main>
</div>
<div class="scrim" id="about" hidden><div class="dlg" role="dialog" aria-modal="true"><h3><span data-t="about.title"></span><button type="button" class="ibtn" id="about-close" data-tt="about.close"><svg class="ico" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button></h3><dl id="about-body"></dl></div></div>
<div class="tip" id="tip"></div>
<script type="module" src="/app.js"></script>
</body></html>
