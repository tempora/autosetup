<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<title>autosetup</title>
<style>
/* Follows UI_LAYOUT_CONTRACT.md (approved 2026-10-22, amended 2026-10-23, 2026-10-28 and 2026-10-29). Desktop only. */
*{box-sizing:border-box}
*{border-radius:0 !important}
[hidden]{display:none !important}
.round,.live-dot{border-radius:50% !important}
:root{color-scheme:dark;--bg:#111214;--surface:#18191c;--line:#26282b;--text:#e4e4e2;--muted:#8a8d93;--danger:#e5534b;
--s1:#4a90d9;--s2:#e08a3c;--us:#3aa6a0;--os:#d9534f;--live:#e5484d;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--ease:cubic-bezier(.16,1,.3,1)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){color-scheme:light;--bg:#f5f5f3;--surface:#eaeae7;--line:#d9d9d6;
--text:#1d1e21;--muted:#686b71;--danger:#b42318;--s1:#2563ad;--s2:#b05a10;--us:#1f7f79;--os:#b93a36;--live:#c62f34}}
:root[data-theme="light"]{color-scheme:light;--bg:#f5f5f3;--surface:#eaeae7;--line:#d9d9d6;
--text:#1d1e21;--muted:#686b71;--danger:#b42318;--s1:#2563ad;--s2:#b05a10;--us:#1f7f79;--os:#b93a36;--live:#c62f34}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);min-width:1000px;min-height:640px;overflow:hidden;
font:15px/1.5 "IBM Plex Sans","Segoe UI Variable","Segoe UI",system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--muted);outline-offset:2px}
.mini{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.ico{display:inline-block;vertical-align:middle;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:38px;padding:7px 14px;
border:1px solid var(--line);background:transparent;font-size:14px;transition:background 150ms ease,color 150ms ease,border-color 150ms ease}
.btn:hover{background:var(--surface)}
.btn.on{background:var(--text);border-color:var(--text);color:var(--bg)}
.btn.primary{background:var(--text);border-color:var(--text);color:var(--bg);min-height:46px;font-weight:600;padding:0 22px}
.btn.quiet{border-color:transparent;color:var(--muted)}
.btn.quiet:hover{color:var(--text);background:none}
.btn:disabled{opacity:.4;cursor:default}
.icon-btn{width:34px;height:34px;padding:0;border:1px solid transparent;background:none;color:var(--muted);
display:inline-flex;align-items:center;justify-content:center;transition:color 150ms ease,border-color 150ms ease}
.icon-btn:hover{color:var(--text);border-color:var(--line)}
.seg{display:inline-grid;grid-auto-flow:column;gap:2px}
.seg .btn{min-height:34px;padding:4px 14px;font-size:13px;color:var(--muted)}
.seg .btn.on{color:var(--bg)}
.empty{color:var(--muted);font-size:14px;padding:10px 0}

/* ---------- nav ---------- */
.app{display:grid;grid-template-rows:44px minmax(0,1fr);height:100vh}
.nav{display:flex;align-items:center;gap:16px;padding:0 16px;border-bottom:1px solid var(--line)}
.tabs{display:flex;height:100%}
.tab{position:relative;height:100%;padding:0 16px;border:none;background:none;color:var(--muted);font-size:14px;font-weight:500;transition:color 150ms ease}
.tab:hover:not(:disabled){color:var(--text)}
.tab.on{color:var(--text)}
.tab::after{content:"";position:absolute;left:16px;right:16px;bottom:-1px;height:2px;background:var(--text);transform:scaleX(0);transition:transform 200ms var(--ease)}
.tab.on::after{transform:scaleX(1)}
.tab:disabled{opacity:.35;cursor:default}
.hist-mark{display:flex;align-items:center;height:24px;margin-left:8px;padding-left:24px;border-left:1px solid var(--line)}
.live-dot{display:inline-block;width:8px;height:8px;background:var(--muted)}
.live-dot.on{background:var(--live)}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:6px}
.err{color:var(--danger);font-size:13px;max-width:420px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- screens ---------- */
main{position:relative;min-height:0}
.screen{position:absolute;inset:0;opacity:0;visibility:hidden;transform:scale(.99);
transition:opacity 200ms var(--ease),transform 200ms var(--ease),visibility 200ms}
.screen.on{opacity:1;visibility:visible;transform:none}
.split{display:grid;grid-template-columns:300px minmax(0,1fr)}
.left{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line)}
.left-scroll{flex:1;min-height:0;overflow-y:auto;scrollbar-width:thin;padding:18px 20px}
.left-scroll>section{padding:0 0 18px;margin:0 0 18px;border-bottom:1px solid var(--line)}
.left-scroll>section:last-child{border-bottom:none;margin-bottom:0}
.pinned{display:flex;flex-direction:column;gap:8px;padding:14px 20px 18px;border-top:1px solid var(--line)}
.pinned .btn{width:100%;justify-content:space-between}
.pinned .seg{display:grid;grid-template-columns:1fr 1fr}
.pinned .seg .btn{justify-content:center}
.sess .track{font-size:16px;font-weight:600;line-height:1.35}
.sess .car{font-size:13.5px;color:var(--muted)}

/* welcome */
.welcome{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center}
.welcome h1{margin:0;font-size:28px;font-weight:500;letter-spacing:-.01em}
.welcome p{margin:0;max-width:560px;color:var(--muted);font-size:16px}
.welcome p.start{font-size:14px;margin-top:6px}

/* lap analysis: left */
.lap-time{font:500 30px/1.15 var(--mono);margin:4px 0 12px}
.kv{width:100%;border-collapse:collapse;font:14px/1.5 var(--mono)}
.kv td{padding:3px 0;text-align:right;white-space:nowrap}
.kv td+td,.kv th+th{padding-left:14px}
.kv.ab{font-size:13px}
.kv.ab td:first-child{width:1%}
.kv td:first-child{text-align:left;font:13.5px/1.5 "IBM Plex Sans",system-ui,sans-serif;color:var(--muted)}
.kv th{text-align:right;padding:0 0 4px;font:600 11px var(--mono);color:var(--muted)}
.kv .win{font-weight:600}
.stint-row{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:38px;padding:6px 8px;border:none;
background:none;text-align:left;font:14px var(--mono);transition:background 150ms ease}
.stint-row:hover{background:var(--surface)}
.stint-row .ico{transition:transform 200ms var(--ease);margin-right:6px}
.stint-row[aria-expanded="true"] .ico{transform:rotate(90deg)}
.laps{overflow:hidden;transition:height 200ms var(--ease)}
.lap-row{display:grid;grid-template-columns:14px minmax(0,1fr) auto;align-items:center;gap:6px;width:100%;min-height:32px;padding:3px 8px 3px 28px;
border:none;background:none;text-align:left;font:13.5px var(--mono);color:var(--text);transition:background 150ms ease}
.lap-row:hover{background:var(--surface)}
.lap-row.dropped{color:var(--muted)}
.lap-row .mark{width:12px;height:3px}

/* lap analysis: centre */
.centre{display:flex;flex-direction:column;min-width:0;min-height:0;padding:12px 24px 16px}
.map-box{position:relative;flex:1;min-height:200px}
#map{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
#map.panning{cursor:grabbing}
#map text{font:11px var(--mono);fill:var(--muted)}
#map text.wait{font:14px "IBM Plex Sans",system-ui,sans-serif}
.map-tools{position:absolute;right:0;top:0}
.readout{display:flex;gap:22px;font:14px/1.5 var(--mono);min-height:24px;padding:6px 0 2px;white-space:nowrap;overflow:hidden}
.readout .k{color:var(--muted);margin-right:6px;font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:12.5px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;margin:0;background:none;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:20px;margin-top:-9px;background:var(--text);border:none;transition:transform 150ms ease}
input[type=range]:active::-webkit-slider-thumb{transform:scaleX(1.4)}
input[type=range]::-moz-range-track{height:2px;background:var(--line)}
input[type=range]::-moz-range-thumb{width:12px;height:20px;background:var(--text);border:none}
.traces svg{display:block;width:100%}
.traces text{font:10.5px var(--mono);fill:var(--muted)}
.grid line{stroke:var(--line);stroke-width:1}

/* setup */
.setup-centre{display:flex;flex-direction:column;min-width:0;min-height:0;padding:12px 24px 16px;gap:10px}
.setup-top{display:flex;align-items:center;gap:12px;min-height:34px}
.setup-top .adv{margin-left:auto}
.adv-box{display:flex;flex-direction:column;flex:1;min-height:0;gap:10px}
.vis{flex:1;min-height:0;overflow-y:auto;scrollbar-width:thin;border-top:1px solid var(--line)}
.vis-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-bottom:1px solid var(--line)}
.vis-row>div{padding:12px 16px 14px;min-width:0}
.vis-row>div+div{border-left:1px solid var(--line)}
.vis-row.one{grid-template-columns:minmax(0,1fr)}
.vis svg{display:block;width:100%;overflow:visible}
.vis svg text{font:11px var(--mono);fill:var(--muted)}
.vis svg text.v{fill:var(--text);font-size:13px}
.vis svg text.big{fill:var(--text);font-size:15px}
.vis .lapd{font:500 24px/1.2 var(--mono);margin:4px 0 8px}
.vis .lapd .sd{font-size:14px;color:var(--muted);margin-left:6px}
.susp-tools{display:flex;align-items:center;gap:16px;margin:2px 0 10px}
.susp-tools .mini{margin-right:2px}
.susp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 28px}
.susp .stats{font:12px/1.5 var(--mono);color:var(--muted);margin-top:4px}
.table-scroll{flex:1;min-height:0;overflow:auto;scrollbar-width:thin;border-top:1px solid var(--line)}
table.big{border-collapse:separate;border-spacing:0;font:13.5px/1.4 var(--mono)}
table.big th,table.big td{padding:5px 12px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
table.big thead th{position:sticky;top:0;z-index:2;background:var(--bg);font:600 11.5px var(--mono);color:var(--muted)}
table.big tbody th{position:sticky;left:0;z-index:1;background:var(--bg);text-align:left;font:13.5px "IBM Plex Sans",system-ui,sans-serif;color:var(--text);min-width:220px}
table.big thead th:first-child{left:0;z-index:3}
table.big th .u{color:var(--muted);font:11.5px var(--mono);margin-left:6px}
table.big tr.grp th{padding-top:16px;color:var(--muted);font:600 11px "IBM Plex Sans",system-ui,sans-serif;letter-spacing:.09em;text-transform:uppercase}
table.big td.chg{font-weight:600}
table.big td.dropped,table.big th.dropped{color:var(--muted)}
table.big tbody tr:hover td,table.big tbody tr:hover th{background:var(--surface)}

/* history */
.hist{height:100%;overflow:auto;padding:18px 24px}
table.list{width:100%;max-width:1100px;border-collapse:collapse;font:14px/1.5 var(--mono)}
table.list th{text-align:left;padding:6px 12px;font:600 11px "IBM Plex Sans",system-ui,sans-serif;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line)}
table.list td{padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
table.list td:first-child,table.list td:nth-child(2){font-family:"IBM Plex Sans",system-ui,sans-serif;white-space:normal}
table.list tbody tr{cursor:pointer;transition:background 150ms ease}
table.list tbody tr:hover{background:var(--surface)}
table.list tr.cur td{font-weight:600}

/* ---------- setup pop-up ---------- */
.modal-back{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.45);
opacity:0;visibility:hidden;transition:opacity 200ms var(--ease),visibility 200ms}
.modal-back.open{opacity:1;visibility:visible}
.modal{width:min(720px,calc(100vw - 48px));max-height:calc(100vh - 80px);display:flex;flex-direction:column;background:var(--bg);
border:1px solid var(--line);transform:scale(.97) translateY(6px);transition:transform 200ms var(--ease)}
.modal-back.open .modal{transform:none}
.modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:16px 20px 12px;border-bottom:1px solid var(--line)}
.modal-file{font:600 15px/1.35 var(--mono);overflow-wrap:anywhere;margin-top:2px}
.modal-body{flex:1;min-height:0;overflow-y:auto;scrollbar-width:thin;padding:4px 20px 12px}
.modal-foot{display:flex;align-items:center;gap:12px;padding:12px 20px 16px;border-top:1px solid var(--line)}
.modal-foot .status{flex:1;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.modal-foot .status.error{color:var(--danger)}
.change{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:2px 10px;padding:10px 0;border-bottom:1px solid var(--line)}
.change .name{grid-column:1;font-size:15px}
.change .delta{grid-column:2;grid-row:1/span 3;align-self:center;font:15px var(--mono);text-align:right}
.change .lock{grid-column:3;grid-row:1/span 3;align-self:center}
.change .vals{grid-column:1;font:13px var(--mono);color:var(--muted)}
.change .why{grid-column:1;font-size:13px;color:var(--muted)}
#changes{transition:opacity 150ms ease}
#changes.busy{opacity:.4}
.spin{animation:spin 900ms linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.lock{width:34px;height:34px;padding:0;border:none;background:none;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;transition:color 150ms ease}
.lock:hover,.lock[aria-pressed="true"]{color:var(--text)}
.modal-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.feelrow{display:grid;grid-template-columns:72px auto;align-items:center;gap:10px;padding:8px 0}
.feel-acts{display:flex;align-items:center;gap:8px;padding:6px 0 12px;border-bottom:1px solid var(--line)}
.gap{font-size:13.5px;padding:10px 0;border-bottom:1px solid var(--line)}
.tip{position:fixed;z-index:200;pointer-events:none;background:var(--surface);border:1px solid var(--line);
padding:6px 9px;font:12px/1.45 var(--mono);color:var(--muted);display:none;max-width:260px}
.tip b{color:var(--text);font-weight:600}
svg.plot{display:block;width:100%;overflow:visible}
svg.plot text{font:11px var(--mono);fill:var(--muted)}
/* ---------- menu (§1) ---------- */
.menu-wrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 5px);z-index:60;min-width:200px;padding:4px 0;background:var(--bg);border:1px solid var(--line);
opacity:0;visibility:hidden;transform:translateY(-4px);transition:opacity 150ms var(--ease),transform 150ms var(--ease),visibility 150ms}
.menu.open{opacity:1;visibility:visible;transform:none}
.mitem{display:block;width:100%;min-height:36px;padding:8px 14px;border:none;background:none;text-align:left;font-size:14px;transition:background 150ms ease}
.mitem:hover,.mitem:focus-visible{background:var(--surface)}

/* ---------- driver, settings (§16, §17) ---------- */
.page{height:100%;overflow-y:auto;scrollbar-width:thin;padding:18px 24px 32px}
.page-inner{max-width:1000px}
.page>.page-inner>section{padding:0 0 22px;margin:0 0 22px;border-bottom:1px solid var(--line)}
.page>.page-inner>section:last-child{border-bottom:none}
.page h2{margin:0 0 12px;font-size:17px;font-weight:600}
.page h2 .mono{font-size:13.5px;font-weight:400;color:var(--muted);margin-left:8px}
.page .mini{margin:14px 0 4px}
table.facts{width:100%;border-collapse:collapse;font:14px/1.5 var(--mono)}
table.facts th{text-align:left;padding:6px 12px 6px 0;font:600 11px "IBM Plex Sans",system-ui,sans-serif;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line)}
table.facts td{padding:7px 12px 7px 0;border-bottom:1px solid var(--line);white-space:nowrap}
table.facts td.line{font-family:"IBM Plex Sans",system-ui,sans-serif;white-space:normal;width:50%}
table.facts td:first-child{font-family:"IBM Plex Sans",system-ui,sans-serif}
.srow{display:grid;grid-template-columns:200px minmax(0,1fr) auto;align-items:center;gap:12px;min-height:46px;padding:6px 0;border-bottom:1px solid var(--line)}
.srow>span:first-child{font-size:14px;color:var(--muted)}
.srow .path{font:13px var(--mono);overflow-wrap:anywhere}
.srow .acts{display:flex;align-items:center;gap:8px}
.menu-screen.screen{display:flex;flex-direction:column}
.menu-screen .page{flex:1;min-height:0}
.page-foot{display:flex;justify-content:flex-end;padding:12px 24px 16px;border-top:1px solid var(--line)}
@media(prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style></head><body>
<div class="app">
 <nav class="nav">
  <div class="tabs" role="tablist">
   <button type="button" class="tab" role="tab" data-screen="analysis" id="tab-analysis">Lap Analysis</button>
   <button type="button" class="tab" role="tab" data-screen="setup" id="tab-setup">Setup</button>
   <button type="button" class="tab" role="tab" data-screen="history" id="tab-history">History</button>
  </div>
  <div class="hist-mark" id="hist-mark" hidden><button type="button" class="btn quiet" id="hist-back"><span class="live-dot" id="live-dot"></span>Back to live</button></div>
  <div class="nav-right">
   <span class="err" id="err"></span>
   <div class="menu-wrap">
    <button id="menu-btn" class="icon-btn" type="button" aria-label="Menu" title="Menu" aria-haspopup="menu" aria-expanded="false"><svg class="ico" width="16" height="16" viewBox="0 0 24 24"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg></button>
    <div class="menu" id="menu" role="menu">
     <button type="button" class="mitem" role="menuitem" data-go="driver">Driver</button>
     <button type="button" class="mitem" role="menuitem" data-go="settings">Settings</button>
     <button type="button" class="mitem" role="menuitem" data-go="about">About</button>
    </div>
   </div>
  </div>
 </nav>
 <main>
  <section class="screen" id="screen-welcome" aria-label="Welcome">
   <div class="welcome"><h1>Welcome back</h1><p id="fact"></p><p class="start">Launch a session in LMU</p></div>
  </section>

  <section class="screen split" id="screen-analysis" aria-label="Lap Analysis">
   <aside class="left">
    <div class="left-scroll">
     <section class="sess"><div class="track" data-f="track"></div><div class="car" data-f="car"></div></section>
     <section id="lapbox"></section>
     <section><div class="mini" style="margin-bottom:6px">Stints</div><div id="stints"></div></section>
    </div>
    <div class="pinned">
     <button type="button" class="btn" id="compare" aria-pressed="false">Compare</button>
     <div class="seg" id="sync" role="group" aria-label="Markers follow" hidden></div>
     <button type="button" class="btn next-setup">Next setup</button>
    </div>
   </aside>
   <div class="centre">
    <div class="map-box" id="map-box"><svg id="map" role="img" aria-label="Track map"></svg>
     <div class="map-tools"><button type="button" class="btn quiet" id="zoom-reset" hidden>Whole lap</button></div></div>
    <div class="readout" id="readout"></div>
    <input type="range" id="slider" min="0" max="1000" value="0" aria-label="Position on lap">
    <div class="traces" id="traces"></div>
   </div>
  </section>

  <section class="screen split" id="screen-setup" aria-label="Setup">
   <aside class="left">
    <div class="left-scroll">
     <section class="sess"><div class="track" data-f="track"></div><div class="car" data-f="car"></div></section>
     <section><div class="mini">Base</div><div class="mono" id="base-stint" style="margin-top:4px"></div></section>
    </div>
    <div class="pinned"><button type="button" class="btn next-setup">Next setup</button></div>
   </aside>
   <div class="setup-centre">
    <div class="setup-top">
     <div class="seg" id="table-by" role="group" aria-label="Columns" hidden></div>
     <button type="button" class="btn adv" id="advanced" aria-pressed="false">Advanced</button>
    </div>
    <div class="vis" id="vis"></div>
    <div class="adv-box" id="adv-box" hidden><div class="table-scroll" id="table-scroll"></div></div>
   </div>
  </section>

  <section class="screen" id="screen-history" aria-label="History">
   <div class="hist" id="history"></div>
  </section>

  <section class="screen menu-screen" id="screen-driver" aria-label="Driver">
   <div class="page"><div class="page-inner" id="driver"></div></div>
   <div class="page-foot"><button type="button" class="btn page-close">Close</button></div>
  </section>

  <section class="screen menu-screen" id="screen-settings" aria-label="Settings">
   <div class="page"><div class="page-inner" id="settings"></div></div>
   <div class="page-foot"><button type="button" class="btn page-close">Close</button></div>
  </section>
 </main>
</div>

<div class="modal-back" id="modal">

// Display units (Settings, §17). Data arrives in km/h, °C and kPa; LMU's own setting

const S = {

const TIPS = {

const MENU_SCREENS = {driver: "Driver", settings: "Settings"};

function renderSession() {

// ---------- sessions: live, history ----------
async function openSession(id, history) {

// Reloads that arrive while one is running are merged into a single follow-up.

async function loadStintsNow(keep) {

async function pollLive() {

$("hist-back").onclick = async () => {

async function loadWelcome() {

}

async function loadState() {

// ---------- stints and laps (left) ----------

const baseStint = () => [...S.stints].reverse().find(s => s.laps.some(l => !l.in_pits)) || S.stints[S.stints.length - 1] || null;

}
function renderLeft() {

  const wrap = el("div");

}
const LAP_ROWS = [

];
function renderLapBox() {

 box.append(el("div", {class: "mini"}, name(A)), el("div", {class: "lap-time"}, fmtLap(A.time)));

  t.append(r);

  const va = f(A), vb = B ? f(B) : null;
  if (va == null && vb == null) continue;

  r.append(el("td", {}, label), el("td", {}, fx(va, dec)));

$("compare").onclick = () => {

// Distance: both markers at one point of the lap. Time: each where its lap was that many
// seconds in, like a ghost; S.pos and S.target then hold seconds (§3).
function renderSync() {

}
function setSync(mode) {

 const p = !A ? 0 : mode === "time" ? (valueAt(A, "time", S.pos) ?? 0) : (distAt(A, S.pos) ?? 0);

}
function distAt(lap, t) {
 if (!lap) return null;

 if (ts[lo] == null || t <= ts[lo]) return tr.distance[lo];

 while (hi - lo > 1) { const m = (lo + hi) >> 1; if (ts[m] != null && ts[m] <= t) lo = m; else hi = m; }

}
const timed = () => !!(S.compare && S.sync === "time" && S.lapA && S.lapB);
const posOf = lap => !lap ? null : timed() ? distAt(lap, S.pos) : S.pos;  // where this lap's marker is, m
// What the slider spans: elapsed time in Time mode, else the visible part of the lap.
const sliderRange = () => timed() ? [0, Math.max(S.lapA.time, S.lapB.time)] : visibleRange();
const fromDist = d => timed() ? (valueAt(S.lapA, "time", d) ?? 0) : d;

// ---------- laps, map, slider, traces ----------
async function loadMap() {

}
const lapCache = new Map();

}
async function loadLaps() {

}
function lapLength() {

}
const visibleRange = () => S.zoom || [0, lapLength()];

 const hit = sv("circle", {cx: x, cy: y, r: 12, fill: "transparent"});
 g.append(hit);
 if (onTip) {
  g.addEventListener("pointermove", e => showTip(e, onTip()));
  g.addEventListener("pointerleave", hideTip);
  g.addEventListener("focus", () => { const r = hit.getBoundingClientRect(); showTip({clientX: r.right, clientY: r.top}, onTip()); });
  g.addEventListener("blur", hideTip);
 }
 if (onClick) { g.style.cursor = "pointer"; g.addEventListener("click", onClick); g.addEventListener("keydown", e => { if (e.key === "Enter") onClick(); }); }
 f.svg.append(g);
}
// ---------- menu (§1) ----------
function openMenu() { $("menu").classList.add("open"); $("menu-btn").setAttribute("aria-expanded", "true"); $("menu").querySelector(".mitem").focus(); }
function closeMenu(focus) { $("menu").classList.remove("open"); $("menu-btn").setAttribute("aria-expanded", "false"); if (focus) $("menu-btn").focus(); }
$("menu-btn").onclick = e => { e.stopPropagation(); if ($("menu").classList.contains("open")) closeMenu(); else openMenu(); };
document.addEventListener("click", e => { if (!e.target.closest(".menu-wrap")) closeMenu(); });
for (const b of document.querySelectorAll(".mitem")) b.onclick = () => {
 closeMenu();
 const go = b.dataset.go;
 if (go === "about") openAbout(); else show(go);
};
function openPopup(id) { $(id).classList.add("open"); $(id).querySelector(".pop-close").focus(); }
function closePop(p) { p.classList.remove("open"); }
for (const p of document.querySelectorAll(".pop")) {
 p.querySelector(".pop-close").onclick = () => closePop(p);
 p.addEventListener("click", e => { if (e.target === p) closePop(p); });
}

// ---------- about (§18) ----------
function kvTable(rows) {
 const t = el("table", {class: "kv"});
 for (const [k, v, mono] of rows) {
  const r = el("tr"), c = el("td", {style: "text-align:left;white-space:normal;overflow-wrap:anywhere"});
  if (mono) c.append(...v); else c.textContent = v;
  r.append(el("td", {}, k), c);
  t.append(r);
 }
 return t;
}
async function openAbout() {
 openPopup("about");
 try {
  const a = await api("/api/about");
  $("about-body").replaceChildren(kvTable([["Version", a.version], ["Metrics version", String(a.metrics_version)],
   ["Database", [el("span", {class: "mono"}, a.database)], true], ["Recordings", String(a.recordings)], ["Laps", String(a.laps)]]));
 } catch (e) { $("about-body").replaceChildren(el("div", {class: "empty"}, e.message)); }
}

// ---------- driver (§16) ----------
const carName = k => String(k).replace(/_/g, " ");
function factsTable(headers, rows) {
 const t = el("table", {class: "facts"}), h = el("tr");
 headers.forEach(x => h.append(el("th", {}, x)));
 const thead = el("thead"); thead.append(h);
 const tb = el("tbody");
 for (const r of rows) {
  const tr = el("tr");
  r.forEach((c, i) => tr.append(el("td", {class: i === r.length - 1 ? "line" : ""}, c)));
  tb.append(tr);
 }
 t.append(thead, tb);
 return t;
}
function feelPlot(box, cars) {
 // Looser ↔ Safer across, Pointier ↔ Lazier up, button steps from the class's usual balance.
 const lim = Math.max(3, Math.ceil(Math.max(...cars.flatMap(c => [Math.abs(c.rear), Math.abs(c.front)]))));
 const W = 420, H = 360, m = {l: 64, r: 64, t: 22, b: 30}, pw = W - m.l - m.r, ph = H - m.t - m.b;
 const sx = v => m.l + (v + lim) / (2 * lim) * pw, sy = v => m.t + (1 - (v + lim) / (2 * lim)) * ph;
 const svg = sv("svg", {class: "plot", viewBox: `0 0 ${W} ${H}`, height: H, role: "img", style: `max-width:${W}px`});
 const g = sv("g", {class: "grid"});
 for (let v = -lim; v <= lim; v++) {
  g.append(sv("line", {x1: sx(v), x2: sx(v), y1: m.t, y2: m.t + ph}), sv("line", {x1: m.l, x2: m.l + pw, y1: sy(v), y2: sy(v)}));
 }
 svg.append(g, sv("line", {x1: sx(0), x2: sx(0), y1: m.t, y2: m.t + ph, stroke: css("--muted"), "stroke-width": 1}),
  sv("line", {x1: m.l, x2: m.l + pw, y1: sy(0), y2: sy(0), stroke: css("--muted"), "stroke-width": 1}));
 svg.append(sv("text", {x: m.l - 8, y: sy(0) + 4, "text-anchor": "end"}, "Looser"), sv("text", {x: m.l + pw + 8, y: sy(0) + 4}, "Safer"),
  sv("text", {x: sx(0), y: m.t - 8, "text-anchor": "middle"}, "Lazier"), sv("text", {x: sx(0), y: H - 8, "text-anchor": "middle"}, "Pointier"));
 const f = {svg};
 for (const c of cars) {
  dot(f, sx(c.rear), sy(c.front), {color: css("--s1"), onTip: () => [carName(c.car_key), c.line, `${c.layout} · ${fmtStamp(c.created_at)}`]});
  svg.append(sv("text", {x: sx(c.rear) + 9, y: sy(c.front) - 8}, carName(c.car_key)));
 }
 box.append(svg);
}
async function loadDriver() {
 const box = $("driver");
 let d;
 try { d = await api("/api/driver"); } catch (e) { showError(e.message); return; }
 if (!d.classes.length) { box.replaceChildren(el("div", {class: "empty"}, "No laps yet")); return; }
 box.replaceChildren(...d.classes.map(c => {
  const sec = el("section"), h = el("h2", {}, c.car_class);
  h.append(el("span", {class: "mono"}, `${c.laps} laps`));
  sec.append(h);
  if (!c.cars.length) { sec.append(el("div", {class: "empty"}, "No fingerprint yet")); return sec; }
  feelPlot(sec, c.cars);
  sec.append(factsTable(["Car", ""], c.cars.map(x => [carName(x.car_key), x.line])));
  return sec;
 }));
}

// ---------- settings (§17) ----------
const FOLDER_NAME = {install: "LMU install", telemetry: "Telemetry", settings: "Settings", database: "Database"};
let confirmForget = null, dataStatus = "";
function srow(label, ...right) {
 const r = el("div", {class: "srow"});
 r.append(el("span", {}, label));
 const mid = right.length > 1 ? right[0] : el("span");
 const acts = el("div", {class: "acts"});
 acts.append(...(right.length > 1 ? right.slice(1) : right));
 r.append(mid, acts);
 return r;
}
function segEl(values, labels, current, onPick) {
 const box = el("div", {class: "seg", role: "group"});
 box.append(...values.map((v, i) => {
  const b = el("button", {type: "button", class: "btn" + (v === current ? " on" : ""), "aria-pressed": v === current}, labels[i]);
  b.onclick = () => { if (v !== current) onPick(v); };
  return b;
 }));
 return box;
}
async function loadSettings() {
 try { S.settings = await api("/api/settings"); Object.assign(UNIT, S.settings.units); } catch (e) { showError(e.message); return; }
 renderSettings();
}
async function putSettings(body) {
 try {
  S.settings = await api("/api/settings", body);
  Object.assign(UNIT, S.settings.units);
 } catch (e) { showError(e.message); return; }
 renderSettings();
 if (body.units) { renderLapBox(); drawAll(); if (S.table) renderTable(); await loadProposal(); }
}
function renderSettings() {
 const st = S.settings, box = $("settings");
 if (!st) return;
 const ch = st.unit_choices;
 const appearance = el("section");
 appearance.append(el("h2", {}, "Appearance"),
  srow("Theme", segEl(["system", "dark", "light"], ["System", "Dark", "Light"], themePref(), v => setThemePref(v))));
 const unitsSec = el("section");
 unitsSec.append(el("h2", {}, "Units"),
  srow("Speed", segEl(ch.speed, ch.speed, st.units.speed, v => putSettings({units: {speed: v}}))),
  srow("Temperature", segEl(ch.temp, ch.temp, st.units.temp, v => putSettings({units: {temp: v}}))),
  srow("Pressure", segEl(ch.pressure, ch.pressure, st.units.pressure, v => putSettings({units: {pressure: v}}))));
 const data = el("section");
 data.append(el("h2", {}, "Data"));
 for (const f of st.folders) {
  const open = el("button", {type: "button", class: "btn quiet"}, "Open folder");
  open.disabled = !f.path;
  open.onclick = async () => { try { await api("/api/open-folder", {which: f.which}); } catch (e) { showError(e.message); } };
  data.append(srow(FOLDER_NAME[f.which] || f.which, el("span", {class: "path"}, f.path || "–"), open));
 }
 const imp = el("button", {type: "button", class: "btn"}, "Import now");
 imp.onclick = async () => {
  imp.disabled = true;
  try { const r = await api("/api/import", {}); dataStatus = `Imported ${r.imported}`; } catch (e) { showError(e.message); }
  renderSettings();
 };
 const rec = el("button", {type: "button", class: "btn"}, st.recomputing ? "Recomputing" : "Recompute metrics");
 rec.disabled = st.recomputing;
 rec.onclick = async () => {
  try { await api("/api/recompute", {}); } catch (e) { showError(e.message); return; }
  await loadSettings(); pollRecompute();
 };
 const status = st.recomputed != null && !st.recomputing ? `Recomputed ${st.recomputed}` : dataStatus;
 data.append(srow("", el("span", {class: "mono muted"}, status), imp, rec));
 const prof = el("section");
 prof.append(el("h2", {}, "Driver profile"));
 const fps = st.fingerprints || [];
 if (!fps.length) prof.append(el("div", {class: "empty"}, "No fingerprint yet"));
 for (const f of fps) {
  const info = el("span", {class: "mono muted"}, `${f.car_class} · ${f.layout} · ${fmtStamp(f.created_at)}`);
  if (confirmForget === f.car_key) {
   const yes = el("button", {type: "button", class: "btn"}, "Confirm forget"), no = el("button", {type: "button", class: "btn quiet"}, "Cancel");
   yes.onclick = async () => {
    confirmForget = null;
    try { await api("/api/forget", {car_key: f.car_key}); } catch (e) { showError(e.message); }
    await loadSettings(); await loadProposal();
   };
   no.onclick = () => { confirmForget = null; renderSettings(); };
   prof.append(srow(carName(f.car_key), info, no, yes));
  } else {
   const b = el("button", {type: "button", class: "btn"}, "Forget fingerprint");
   b.onclick = () => { confirmForget = f.car_key; renderSettings(); };
   prof.append(srow(carName(f.car_key), info, b));
  }
 }
 box.replaceChildren(appearance, unitsSec, data, prof);
}
const fmtStamp = s => { const m = String(s).match(/(\d{4})-(\d\d)-(\d\d)/); return m ? `${m[3]}.${m[2]}.${m[1]}` : String(s); };
async function pollRecompute() {
 await loadSettings();
 if (S.settings && S.settings.recomputing) setTimeout(pollRecompute, 1000);
}

// ---------- start ----------
setThemePref(themePref());
(async () => {
 try { const w = await loadState(); importStamp = `${w.imported}|${w.last_import}`; } catch (e) { showError(e.message); }
 try { S.settings = await api("/api/settings"); Object.assign(UNIT, S.settings.units); } catch (e) {}
 try { S.live = await api("/api/live"); } catch (e) {}
 renderNav();
 if (S.live.state === "live" && S.live.session) { await openSession(S.live.session, false); show("analysis"); }
 else if (S.live.state === "live") { renderSession(); show("analysis"); }
 else { show("welcome"); loadWelcome(); }
 setTimeout(pollLive, 3000);
 setInterval(refresh, 1000);
})();
let down = false;
setInterval(async () => {
 try { const r = await fetch("/api/health", {cache: "no-store"}); if (!r.ok) throw 0; if (down) location.reload(); down = false; }
 catch (e) { down = true; }
}, 2000);
</script>
