# Targets for the rules advisor, per car class.
#
# Calibrated on the development install's GT3 telemetry (78 racing laps, most on
# published pro setups): the bands sit around the p10–p90 of what those setups produce,
# so the advisor only acts when a stint is clearly outside normal. They are not facts
# about LMU's tyre model: tune them against your own data. A class section only needs the
# keys it changes; everything else falls back to [default]. °C, s/lap, mm, kPa.

[default]
# Inner-minus-outer tread temperature, averaged per axle (camber). GT3 data: front
# median ~8.7 (FL 6, FR 11.5), rear ~9.2.
spread_front = [5.0, 12.0]
spread_rear = [6.0, 13.0]
# Centre-minus-edges tread temperature (pressure). In LMU the centre runs ~4–7 °C hotter
# than the edges even at the minimum allowed pressure, so the target is that, not zero.
crown_target = 5.0
crown_band = 3.0
# Optional hot-pressure window in kPa, e.g. [168.0, 178.0]; empty = don't use it.
hot_pressure = []
# Peak brake disc temperature (brake ducts). GT3 data: front p50 ~630, p90 ~790.
brake_temp = [450.0, 850.0]
# Platform: time per lap with a front corner under 1 mm, and the 1st-percentile ride
# height below which we raise the car. Above `lower_above_mm` (and never bottoming) the
# car may come down a step when pace matters. GT3 front p90 ~27 mm.
bottoming_s = 0.2
min_ride_height_mm = 2.0
lower_above_mm = 25.0
# Third spring (prototypes): bottoming while the axle's third spring is on its packers
# less than this share of the lap → a packer step in, instead of a higher ride height
# (which costs downforce). How much packer suits you otherwise is left to the model.
third_packers_lo = 0.05
# Oversteer evidence from telemetry, per lap: countersteer moments in one phase (GT3
# exit p90 = 2), and seconds of traction control (p90 ~4.3). Your rating always wins.
countersteer_per_lap = 2.0
tc_s_per_lap = 5.0
# Balance per cell: corner speed (slow < 108 km/h <= medium <= 162 km/h < fast) × corner
# phase (entry on the brakes, mid, exit on the power). understeer_<cell>: the understeer
# angle (deg) above which a stint counts as understeering there when you haven't rated it,
# the p75 of the GT3 laps (119, mostly pro setups); the balance you like (no ratings yet)
# sits a rating point below it, and Car feel moves it from there. rating_point_<cell>: how
# far one point of your rating moves the angle, the p75 → p90 step (at least 0.08°: a
# smaller step would read measurement noise as whole points).
understeer_slow_entry = 0.77
understeer_slow_mid = 1.94
understeer_slow_exit = 0.35
understeer_medium_entry = 0.43
understeer_medium_mid = 2.0
understeer_medium_exit = 0.5
understeer_fast_entry = 0.31
understeer_fast_mid = 1.34
understeer_fast_exit = 0.32
rating_point_slow_entry = 0.42
rating_point_slow_mid = 0.37
rating_point_slow_exit = 0.42
rating_point_medium_entry = 0.34
rating_point_medium_mid = 0.35
rating_point_medium_exit = 0.11
rating_point_fast_entry = 0.08
rating_point_fast_mid = 0.33
rating_point_fast_exit = 0.08
# Brake pressure (% of the car's maximum) where it's comfortable without ABS. Inside it,
# pressure rises a step per stint until you flag too many lock-ups, then stays a step
# under that. Empty = leave brake pressure alone (cars with ABS).
brake_pressure_pct = []
# Corner passes (metrics/corners.py): a corner is low or high speed by its apex speed.
band_split_kmh = 140.0
# Car feel buttons (feel/target.py): one press moves the target this many degrees of
# understeer angle in the cells its axis covers; a locked fingerprint is "it" within
# ± this much (or twice its measurement noise, if more).
feel_step_deg = 0.25
feel_tolerance_deg = 0.15
# Damper knee (mm/s shaft velocity) between the slow and fast damper circuits. LMU doesn't
# expose it; a starting value to check against the histograms (and DAM logs).
damper_knee_mm_s = 50.0
# Share of off-kerb shaft-velocity samples under the knee the damper module aims for (a
# starting value: most road motion is slow, kerbs and bumps are the fast part).
damper_ls_target = 0.85
# Priors (opt/priors.py): what one real step of a setting does to the balance in the cells
# it acts on most, understeer-angle degrees. A step is a click, or for settings whose
# labels have a unit: 1 mm of ride height, 0.1° of toe, 10 Nm of preload, 1 % of brake
# bias. Starting values: tune them.
step_deg_arb = 0.1          # anti-roll bar click
step_deg_spring = 0.1       # spring click
step_deg_third_spring = 0.08
step_deg_tender = 0.05      # tender spring on / off
step_deg_wing = 0.1         # wing click
step_deg_ride_height = 0.05 # per mm: 2 mm of rake ≈ 0.1° in fast corners
step_deg_toe = 0.05         # per 0.1°
step_deg_preload = 0.05     # per 10 Nm
step_deg_brake_bias = 0.08  # per 1 %, at turn-in
step_deg_damper = 0.03      # slow damper click
step_deg_diff_ramp = 0.08   # diff ramp step
# A setting without a step size above, or with a unit its labels don't show: its whole
# range moves the cells this much at weight 1.
prior_full_range_deg = 0.6
# Aero map priors (sim/aero.py): the direction each platform change pushes, at a size
# that's a guess; aero_prior_sd × each one is its prior sd, so a few stints decide. Per
# FULL range of rear wing, or per mm of front ride height / rake at speed.
#   drag, lift: change of log(drag) / log(downforce term)
#   balance: deg more understeer in high- than in low-speed corners
aero_prior_sd = 1.0
# The class's typical drag k (1/m: drag deceleration = k·v²) and downforce term c
# (1/(m/s)²: grip × (1 + c·v²)) that the shares below are of. Rough: top speed and power
# give k; c is how much more grip the fast corners have.
drag_k_typ = 7e-4
lift_c_typ = 6e-5
aero_drag_per_wing = 0.15
aero_drag_per_mm_rh = 0.0
aero_drag_per_mm_rake = 0.002
aero_lift_per_wing = 0.2
aero_lift_per_mm_rh = -0.01
aero_lift_per_mm_rake = 0.01
aero_balance_per_wing = 0.5
aero_balance_per_mm_rh = 0.02
aero_balance_per_mm_rake = -0.02
# How much may change in one proposal.
max_balance_changes = 2
max_platform_changes = 1
# Drag (opt/drag.py): the share of the lap at full throttle a class usually runs, until
# you've driven it at 3+ layouts (then your own median is used; GT3 here: 0.55 Lusail to
# 0.73 Le Mans, median ~0.60), and seconds across the rear wing's range per unit of share
# above it (0.1 more flat-out share: ~0.4 s for the whole wing range), capped.
full_throttle_ref = 0.60
wing_s_per_full_throttle = 4.0
wing_prior_max_s = 0.6
# Optimiser (phase 4). Lap time cost of fuel load: a starting value (~0.03 s per litre
# for a GT3-sized car); it only shifts stints run at different fuel levels.
fuel_s_per_l = 0.03
# Stints of this car + track layout with 3+ clean laps and at least this many different
# balance setups before the model replaces the balance rules.
model_min_stints = 4
model_min_setups = 3

[Hyper]
brake_temp = [400.0, 1000.0]
fuel_s_per_l = 0.035
brake_pressure_pct = [93.0, 100.0]  # depends on the car; "too much brake pressure" finds where
full_throttle_ref = 0.48  # a guess from one partial lap (Spa); your own median takes over at 3 tracks
drag_k_typ = 9e-4
lift_c_typ = 1.5e-4

[LMP2]
brake_temp = [400.0, 1000.0]
# Its angles run differently from a GT3's (longer car, more downforce): p75 and p75 → p90
# of its laps (35, one track: rough).
understeer_slow_entry = 3.31
understeer_slow_mid = 5.03
understeer_slow_exit = 0.7
understeer_medium_entry = 0.48
understeer_medium_mid = 2.67
understeer_medium_exit = 0.58
understeer_fast_entry = 0.08
understeer_fast_mid = 2.6
understeer_fast_exit = 0.35
rating_point_slow_entry = 0.43
rating_point_slow_mid = 0.71
rating_point_slow_exit = 0.68
rating_point_medium_entry = 0.17
rating_point_medium_mid = 0.24
rating_point_medium_exit = 0.33
rating_point_fast_entry = 0.08
rating_point_fast_mid = 0.12
rating_point_fast_exit = 0.08
brake_pressure_pct = [90.0, 94.0]
full_throttle_ref = 0.49  # a guess from one track (Barcelona); your own median takes over at 3 tracks
band_split_kmh = 150.0  # more downforce: its fast corners start higher
feel_step_deg = 0.3  # its angles run larger
feel_tolerance_deg = 0.2
drag_k_typ = 9e-4
lift_c_typ = 1.5e-4
