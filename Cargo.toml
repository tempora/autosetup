[workspace]
resolver = "2"
members = ["crates/pitwall"]

[workspace.package]
version = "0.5.0-dev"
edition = "2021"
rust-version = "1.90"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
toml = "1"
