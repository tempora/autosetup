<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>autosetup</title>
<style>
/* Shown for the second or two the local server takes to start. Tokens from UI_LAYOUT_CONTRACT.md. */
:root{color-scheme:dark;--bg:#111214;--text:#e4e4e2;--muted:#8a8d93;--danger:#e5534b}
@media(prefers-color-scheme:light){:root{color-scheme:light;--bg:#f5f5f3;--text:#1d1e21;--muted:#686b71;--danger:#b42318}}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);display:flex;align-items:center;justify-content:center;
font:15px/1.5 "IBM Plex Sans","Segoe UI Variable","Segoe UI",system-ui,sans-serif}
.box{max-width:520px;padding:24px}
.mini{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
#msg{margin-top:6px;color:var(--muted);overflow-wrap:anywhere}
#msg.error{color:var(--danger)}
</style></head><body>
<div class="box"><div class="mini">autosetup</div><div id="msg">Starting</div></div>
</body></html>
